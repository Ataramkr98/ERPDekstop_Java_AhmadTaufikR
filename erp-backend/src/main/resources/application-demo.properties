# Demo profile: portfolio walkthrough with a synthetic dataset.
#
# This profile is selected explicitly by scripts\Start-Erp.ps1 -Mode Demo (run-demo.cmd).
# It turns on the demo workspace, which:
#   * creates a dedicated demo tenant (company code DEMO) and a synthetic dataset in it,
#   * mints a session without a password via POST /api/demo/session,
#   * only ever reads and writes rows carrying the demo companyId.
#
# Isolation: DemoSettings forces erp.demo.enabled back to false whenever the Quarkus
# profile starts with "prod" or "live", so demo mode can never be switched on in a
# production deployment even if the property is forced from the command line.
erp.demo.enabled=true
erp.demo.company-code=DEMO
erp.demo.username=demo

# Quieter logs so the reviewer sees the app rather than framework noise.
quarkus.log.level=INFO
quarkus.log.category."com.erp".level=INFO