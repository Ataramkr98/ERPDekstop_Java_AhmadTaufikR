# Credentials come from DATABASE_URL (RuntimeConfigSource), or the DB_* environment.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:erp}${DB_SSL_PARAMS:}}
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=30S
quarkus.datasource.jdbc.idle-removal-interval=5M
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.index-dependency.erp-core.group-id=com.erp
quarkus.index-dependency.erp-core.artifact-id=erp-core
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.clean-disabled=true
quarkus.flyway.locations=classpath:db/migration
# Keys are supplied by the launcher through ERP_KEY_DIR or explicit key properties.
mp.jwt.verify.issuer=erp
quarkus.http.auth.basic=false
quarkus.security.users.embedded.enabled=false
quarkus.http.host=127.0.0.1
quarkus.http.port=${ERP_PORT:8080}
quarkus.http.limits.max-body-size=8M
quarkus.banner.enabled=false
quarkus.log.level=INFO
quarkus.analytics.disabled=true
